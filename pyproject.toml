[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "license-lantern"
version = "1.1.0"
description = "Build reviewable dependency-license inventories and attribution drafts locally."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Logan Pendragon Multiverse" }]
dependencies = ["license-expression>=30.4,<31"]
[project.optional-dependencies]
dev = ["build>=1.3,<2", "mypy>=1.15,<3", "pip-audit>=2.9,<3", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
[project.scripts]
license-lantern = "license_lantern.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.mypy]
python_version = "3.11"
strict = true
[tool.coverage.run]
omit = ["src/*/__main__.py"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=license_lantern --cov-branch --cov-report=term-missing --cov-fail-under=90"
